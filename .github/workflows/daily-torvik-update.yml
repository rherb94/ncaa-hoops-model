name: Daily Torvik Ratings Update

# Torvik returns HTTP 403 to GitHub's servers, so this job fetches the file
# through the site's own /api/torvik pass-through (Vercel is not blocked).
# `npm run ratings` does the same job from a local machine as a fallback.
on:
  schedule:
    # 7:00 AM ET = 12:00 UTC — runs before the odds opener so ratings are fresh
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Season year, the year the season ends in (e.g. 2027). Blank = derived from the date.'
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Update Torvik team ratings
        env:
          YEAR: ${{ inputs.year || '' }}  # blank = derived from today's date (src/lib/season.ts)
          LEAGUE: ncaam
          TORVIK_URL: https://ncaa-hoops-model.vercel.app/api/torvik?league=ncaam${{ inputs.year && format('&year={0}', inputs.year) || '' }}
          # Both optional — only needed if the endpoint is locked down.
          TORVIK_PROXY_SECRET: ${{ secrets.TORVIK_PROXY_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx tsx src/scripts/updateTeamsFromTorvik.ts

      - name: Commit updated teams.csv if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ncaam/teams.csv src/data/ncaam/teamAliases.csv src/data/ncaam/ratingsMeta.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update Torvik ratings $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main
            git push
          fi
